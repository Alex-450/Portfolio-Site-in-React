name: CI

on:
  push:
    branches:
      - master
  pull_request:

# A superseded run tells you nothing useful, so cancel it when new commits land.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # films.json is generated by the scraper and gitignored, but sitemap.ts
      # imports it statically, so tsc needs *something* there. The real data is
      # irrelevant to typechecking, so a stub avoids a network fetch in CI.
      - name: Stub generated film data
        run: '[ -f src/data/films.json ] || echo "{}" > src/data/films.json'

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Check formatting
        run: npm run format:check
